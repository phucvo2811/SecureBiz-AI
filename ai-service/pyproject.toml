[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "securebiz-ai-service"
version = "0.1.0"
description = "Versioned anomaly-detection inference and research pipeline for SecureBiz AI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "pydantic-settings>=2.11,<3",
  "numpy>=2.3,<3",
  "pandas>=2.3,<3",
  "scikit-learn>=1.7,<2",
  "joblib>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "features", "preprocessing", "training", "evaluation", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

