name: ${COMPOSE_PROJECT_NAME:-securebiz-ai}

# Development stack. Replace all placeholder credentials before startup.
services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [securebiz-public, securebiz-internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-securebiz}
      DATABASE_USERNAME: ${POSTGRES_USER:-securebiz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-securebiz-ai}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-replace-with-at-least-32-random-bytes}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-14d}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_AI_API_KEY: ${INTERNAL_AI_API_KEY:-replace-with-random-service-credential}
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-securebiz-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-now}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-documents}
      S3_BUCKET_PRODUCTS: ${S3_BUCKET_PRODUCTS:-product-media}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      BOOTSTRAP_OWNER_USERNAME: ${BOOTSTRAP_OWNER_USERNAME:-owner}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-owner@example.invalid}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-SecureBiz@123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [securebiz-internal]

  model-init:
    build:
      context: ./ai-service
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "if [ ! -f /models/active-model.json ]; then python -m datasets.generate_synthetic --output /tmp/securebiz-synthetic.csv --rows 500 --anomalies 25 --seed 42 && python -m training.train --dataset /tmp/securebiz-synthetic.csv --output /models --algorithm isolation_forest --seed 42 --activate; fi; chown -R 10001:10001 /models"]
    volumes:
      - ai_models:/models
    networks: [securebiz-internal]

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      AI_MODEL_DIR: /app/models/artifacts
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-isolation_forest}
      AI_RANDOM_SEED: ${AI_RANDOM_SEED:-42}
      INTERNAL_AI_API_KEY: ${INTERNAL_AI_API_KEY:-replace-with-random-service-credential}
    volumes:
      - ai_models:/app/models/artifacts:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [securebiz-internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securebiz}
      POSTGRES_USER: ${POSTGRES_USER:-securebiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [securebiz-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [securebiz-internal]

  object-storage:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-securebiz-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change-me-now}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [securebiz-internal]

networks:
  securebiz-public:
    driver: bridge
  securebiz-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  ai_models:
